<linearGradient id="part-current" x1="0" y1="0" x2="1" y2="1" data-part="current"><stop data-shade=".65" stop-color="#abe0cb" stop-opacity=".9" /><stop offset=".25" data-shade="0" stop-color="#0fa66b" stop-opacity=".78" /><stop offset=".52" data-shade=".35" stop-color="#63c59f" stop-opacity=".68" /><stop offset=".74" data-shade="-.35" stop-color="#0a6c46" stop-opacity=".86" /><stop offset="1" data-shade=".6" stop-color="#9fdbc4" stop-opacity=".92" /></linearGradient>
<linearGradient id="part-input" x1="0" y1="0" x2="1" y2="1" data-part="input"><stop data-shade=".65" stop-color="#d6c7bb" stop-opacity=".9" /><stop offset=".25" data-shade="0" stop-color="#8b5e3c" stop-opacity=".78" /><stop offset=".52" data-shade=".35" stop-color="#b49680" stop-opacity=".68" /><stop offset=".74" data-shade="-.35" stop-color="#5a3d27" stop-opacity=".86" /><stop offset="1" data-shade=".6" stop-color="#d1bfb1" stop-opacity=".92" /></linearGradient>
<linearGradient id="part-output" x1="0" y1="0" x2="1" y2="1" data-part="output"><stop data-shade=".65" stop-color="#b3d6f9" stop-opacity=".9" /><stop offset=".25" data-shade="0" stop-color="#2689ed" stop-opacity=".78" /><stop offset=".52" data-shade=".35" stop-color="#72b2f3" stop-opacity=".68" /><stop offset=".74" data-shade="-.35" stop-color="#19599a" stop-opacity=".86" /><stop offset="1" data-shade=".6" stop-color="#a8d0f8" stop-opacity=".92" /></linearGradient>
