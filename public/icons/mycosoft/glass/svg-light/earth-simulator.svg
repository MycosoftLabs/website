<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256" role="img" aria-label="Earth Simulator glass icon">
<title>Earth Simulator — colored symbol on clear glass block</title>
<desc>Editable vector material study. The clear-block layer remains neutral; only the colored-symbol layer changes color.</desc>
