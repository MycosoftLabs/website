<g id="colored-symbol" transform="translate(29.44 29.44) scale(.77)"><g transform="translate(1.5 2.2)" fill="#000000" fill-opacity=".22"><path d="M 59 194 C 51 132 85 85 130 56 C 159 37 194 29 214 30 C 225 30 214 60 201 71 C 184 85 155 86 127 100 C 92 117 71 145 59 194 Z" /><path d="M 68 215 C 63 193 72 157 97 134 C 122 111 157 100 179 98 C 197 96 199 112 194 129 C 187 156 167 174 143 188 C 119 202 91 214 74 218 C 71 219 69 218 68 215 Z" /></g><g fill="url(#symbol-face)" stroke="#787b83" stroke-width=".65" stroke-linejoin="round" class="face-material" stroke-opacity=".48"><path d="M 59 194 C 51 132 85 85 130 56 C 159 37 194 29 214 30 C 225 30 214 60 201 71 C 184 85 155 86 127 100 C 92 117 71 145 59 194 Z" fill="url(#part-upper-spore)" data-part="upper-spore" /><path d="M 68 215 C 63 193 72 157 97 134 C 122 111 157 100 179 98 C 197 96 199 112 194 129 C 187 156 167 174 143 188 C 119 202 91 214 74 218 C 71 219 69 218 68 215 Z" fill="url(#part-lower-spore)" data-part="lower-spore" /></g></g>
