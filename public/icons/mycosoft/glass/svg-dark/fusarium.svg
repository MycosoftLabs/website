<linearGradient id="part-upper-spore" x1="0" y1="0" x2="1" y2="1" data-part="upper-spore"><stop data-shade=".65" stop-color="#25272c" stop-opacity="1" /><stop offset=".25" data-shade="0" stop-color="#111318" stop-opacity="1" /><stop offset=".52" data-shade=".35" stop-color="#1c1e23" stop-opacity="1" /><stop offset=".74" data-shade="-.35" stop-color="#101217" stop-opacity="1" /><stop offset="1" data-shade=".6" stop-color="#24252a" stop-opacity="1" /></linearGradient>
<linearGradient id="part-lower-spore" x1="0" y1="0" x2="1" y2="1" data-part="lower-spore"><stop data-shade=".65" stop-color="#25272c" stop-opacity="1" /><stop offset=".25" data-shade="0" stop-color="#111318" stop-opacity="1" /><stop offset=".52" data-shade=".35" stop-color="#1c1e23" stop-opacity="1" /><stop offset=".74" data-shade="-.35" stop-color="#101217" stop-opacity="1" /><stop offset="1" data-shade=".6" stop-color="#24252a" stop-opacity="1" /></linearGradient>
</defs>
