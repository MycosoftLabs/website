<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256" role="img" aria-label="MYCA glass icon">
<title>MYCA — colored symbol on clear glass block</title>
<desc>Editable vector material study. The clear-block layer remains neutral; only the colored-symbol layer changes color.</desc>
<defs>
<linearGradient id="block-face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f4f6" stop-opacity="1" /><stop offset=".34" stop-color="#f3f4f6" stop-opacity="1" /><stop offset=".8" stop-color="#f3f4f6" stop-opacity="1" /><stop offset="1" stop-color="#f3f4f6" stop-opacity="1" /></linearGradient>
<linearGradient id="block-rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".98" /><stop offset=".18" stop-color="#a7a7a7" stop-opacity=".52" /><stop offset=".45" stop-color="#ffffff" stop-opacity=".3" /><stop offset=".72" stop-color="#404040" stop-opacity=".55" /><stop offset="1" stop-color="#ffffff" stop-opacity=".98" /></linearGradient>
<linearGradient id="symbol-face" x1="0" y1="0" x2="1" y2="1"><stop data-shade=".65" stop-color="#ffffff" stop-opacity=".9" /><stop offset=".25" data-shade="0" stop-color="#ffffff" stop-opacity=".78" /><stop offset=".52" data-shade=".35" stop-color="#ffffff" stop-opacity=".68" /><stop offset=".74" data-shade="-.35" stop-color="#a6a6a6" stop-opacity=".86" /><stop offset="1" data-shade=".6" stop-color="#ffffff" stop-opacity=".92" /></linearGradient>
