<linearGradient id="part-left-lobe" x1="0" y1="0" x2="1" y2="1" data-part="left-lobe"><stop data-shade=".65" stop-color="#25272c" stop-opacity="1" /><stop offset=".25" data-shade="0" stop-color="#111318" stop-opacity="1" /><stop offset=".52" data-shade=".35" stop-color="#1c1e23" stop-opacity="1" /><stop offset=".74" data-shade="-.35" stop-color="#101217" stop-opacity="1" /><stop offset="1" data-shade=".6" stop-color="#24252a" stop-opacity="1" /></linearGradient>
<linearGradient id="part-right-lobe" x1="0" y1="0" x2="1" y2="1" data-part="right-lobe"><stop data-shade=".65" stop-color="#25272c" stop-opacity="1" /><stop offset=".25" data-shade="0" stop-color="#111318" stop-opacity="1" /><stop offset=".52" data-shade=".35" stop-color="#1c1e23" stop-opacity="1" /><stop offset=".74" data-shade="-.35" stop-color="#101217" stop-opacity="1" /><stop offset="1" data-shade=".6" stop-color="#24252a" stop-opacity="1" /></linearGradient>
<linearGradient id="part-seed" x1="0" y1="0" x2="1" y2="1" data-part="seed"><stop data-shade=".65" stop-color="#25272c" stop-opacity="1" /><stop offset=".25" data-shade="0" stop-color="#111318" stop-opacity="1" /><stop offset=".52" data-shade=".35" stop-color="#1c1e23" stop-opacity="1" /><stop offset=".74" data-shade="-.35" stop-color="#101217" stop-opacity="1" /><stop offset="1" data-shade=".6" stop-color="#24252a" stop-opacity="1" /></linearGradient>
</defs>
<g id="clear-block"><rect x="19" y="21" width="218" height="218" rx="44" fill="#000000" fill-opacity=".04" stroke="#000000" stroke-opacity=".22" stroke-width="2" /><rect x="18" y="18" width="218" height="218" rx="43" fill="url(#block-face)" stroke="url(#block-rim)" stroke-width="2.2" /><rect x="21" y="21" width="212" height="212" rx="40" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width=".8" /></g>
<g id="colored-symbol" transform="translate(29.44 29.44) scale(.77)"><g transform="translate(1.5 2.2)" fill="#000000" fill-opacity=".22"><path d="M 118 82 C 118 60 96 48 76 55 C 53 63 28 94 28 125 C 28 159 44 183 70 187 C 76 188 77 186 76 180 C 70 147 87 129 103 116 C 113 107 118 98 118 82 Z" /><path d="M 138 82 C 138 60 160 48 180 55 C 203 63 228 94 228 125 C 228 159 212 183 186 187 C 180 188 179 186 180 180 C 186 147 169 129 153 116 C 143 107 138 98 138 82 Z" /><path d="M 128 111 C 120 129 104 151 104 165 C 104 180 114 191 128 191 C 142 191 152 180 152 165 C 152 151 136 129 128 111 Z" /></g><g fill="url(#symbol-face)" stroke="#787b83" stroke-width=".65" stroke-linejoin="round" class="face-material" stroke-opacity=".48"><path d="M 118 82 C 118 60 96 48 76 55 C 53 63 28 94 28 125 C 28 159 44 183 70 187 C 76 188 77 186 76 180 C 70 147 87 129 103 116 C 113 107 118 98 118 82 Z" fill="url(#part-left-lobe)" data-part="left-lobe" /><path d="M 138 82 C 138 60 160 48 180 55 C 203 63 228 94 228 125 C 228 159 212 183 186 187 C 180 188 179 186 180 180 C 186 147 169 129 153 116 C 143 107 138 98 138 82 Z" fill="url(#part-right-lobe)" data-part="right-lobe" /><path d="M 128 111 C 120 129 104 151 104 165 C 104 180 114 191 128 191 C 142 191 152 180 152 165 C 152 151 136 129 128 111 Z" fill="url(#part-seed)" data-part="seed" /></g></g>
