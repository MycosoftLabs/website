# Earth Simulator — canonical Arraylake field bake (data plane)
# Feeds the shared Website/Fusarium field artifact contract. Keep one scheduler so the
# two views cannot drift or consume separate API-client quotas.
# Re-bakes live cubes on a schedule; static cubes can be run manually once.
name: Arraylake field bake

on:
  schedule:
    # Every 3 hours — live weather/carbon/imagery cubes
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      dataset:
        description: "Optional dataset id (e.g. era5). Empty = all live cubes."
        required: false
        default: ""
      variable:
        description: "Optional variable key (requires dataset)."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: arraylake-field-bake
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ARRAYLAKE_TOKEN: ${{ secrets.ARRAYLAKE_TOKEN }}
      ARRAYLAKE_FIELD_OUT: ${{ vars.ARRAYLAKE_FIELD_OUT || 'fields_out' }}
      ARRAYLAKE_CATALOG_URL: ${{ vars.ARRAYLAKE_CATALOG_URL || 'https://mycosoft.com/api/crep/field/_catalog' }}
      REQUESTED_DATASET: ${{ inputs.dataset || '' }}
      REQUESTED_VARIABLE: ${{ inputs.variable || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Fail before dependency installation with an actionable error. Never print the
      # credential: this job is intended to use the Earth Simulator Bake API client via
      # the repository Actions secret named ARRAYLAKE_TOKEN.
      - name: Validate bake configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ARRAYLAKE_TOKEN:-}" ]; then
            echo "::error title=Arraylake credential missing::Configure the Earth Simulator Bake client as the repository Actions secret ARRAYLAKE_TOKEN. The value must not be committed or printed."
            exit 2
          fi
          case "${ARRAYLAKE_TOKEN}" in
            ema_*|eyJ*.*.*) ;;
            *)
              echo "::error title=Arraylake credential rejected::ARRAYLAKE_TOKEN is present but is not an Earthmover API token or JWT. Replace the repository secret without exposing its value."
              exit 2
              ;;
          esac
          if [ -n "${REQUESTED_VARIABLE}" ] && [ -z "${REQUESTED_DATASET}" ]; then
            echo "::error title=Invalid manual request::A variable can be requested only when a dataset is also supplied."
            exit 2
          fi
          case "${REQUESTED_DATASET}${REQUESTED_VARIABLE}" in
            *[!A-Za-z0-9_-]*)
              echo "::error title=Invalid manual request::Dataset and variable names may contain only letters, numbers, underscores, and hyphens."
              exit 2
              ;;
          esac

      - name: Install bake dependencies
        run: |
          python -m pip install --disable-pip-version-check --requirement scripts/arraylake/requirements-ci.txt
          python -m pip check

      - name: Validate workflow contract
        run: python scripts/arraylake/verify_workflow_contract.py

      - name: Introspect cubes (schema audit)
        run: python scripts/arraylake/introspect.py

      - name: Bake live field cubes
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_DATASET}" ]; then
            if [ -n "${REQUESTED_VARIABLE}" ]; then
              python scripts/arraylake/bake_field.py "${REQUESTED_DATASET}" "${REQUESTED_VARIABLE}"
            else
              python scripts/arraylake/bake_field.py "${REQUESTED_DATASET}"
            fi
          else
            for ds in era5 hrrr helios alive sentinel2 geo-stereo-wind mrms; do
              python scripts/arraylake/bake_field.py "$ds"
            done
          fi

      - name: Validate baked artifact contract
        run: python scripts/arraylake/validate_bake_output.py "${ARRAYLAKE_FIELD_OUT}"

      # CRITICAL: publish the baked frames to the production asset mount, otherwise the
      # bake writes to the ephemeral runner and the data never reaches the website. The
      # field BFF reads ARRAYLAKE_FIELD_BASE = https://mycosoft.com/assets/fields, which
      # is the NAS mount /opt/mycosoft/media/website/assets (mounted read-only into the
      # container at /app/public/assets → served at /assets). Reuses the same
      # Cloudflare-tunnel SSH the prod blue/green deploy uses (ci-cd.yml).
      - name: Setup SSH via Cloudflare Tunnel
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/setup-ssh
        with:
          ssh-key: ${{ secrets.SSH_KEY }}
          ssh-key-b64: ${{ secrets.SSH_KEY_B64 }}
          production-host: ${{ secrets.PRODUCTION_HOST }}
          ssh-user: ${{ secrets.SSH_USER }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          require-cloudflare-access: true

      - name: Publish baked fields to production asset mount
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if [ ! -d "${ARRAYLAKE_FIELD_OUT}" ] || [ -z "$(ls -A "${ARRAYLAKE_FIELD_OUT}" 2>/dev/null)" ]; then
            echo "::error title=Arraylake publication blocked::No validated baked output exists in ${ARRAYLAKE_FIELD_OUT}."
            exit 1
          fi
          ssh-retry production 'mkdir -p /opt/mycosoft/media/website/assets/fields'
          rsync -avz -e ssh "${ARRAYLAKE_FIELD_OUT}/" production:/opt/mycosoft/media/website/assets/fields/
          echo "Published $(find "${ARRAYLAKE_FIELD_OUT}" -name manifest.json | wc -l) manifest(s) to /opt/mycosoft/media/website/assets/fields"

      - name: Upload bake artifact (debug)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arraylake-fields-manifest-snapshot
          path: |
            arraylake_cubes.json
            ${{ env.ARRAYLAKE_FIELD_OUT }}/**/manifest.json
          if-no-files-found: ignore
